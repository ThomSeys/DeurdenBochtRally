<svg width="700" height="700" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F9D976"/>
      <stop offset="100%" stop-color="#C79A2D"/>
    </linearGradient>
  </defs>

  <!-- Outer badge -->
  <circle cx="350" cy="350" r="320" fill="none" stroke="currentColor" stroke-width="18"/>

  <!-- Crown base -->
  <path d="M180 360 H520"
        stroke="url(#gold)"
        stroke-width="16"
        stroke-linecap="round"/>

  <!-- Crown peaks -->
  <path d="M220 360 L280 220 L350 360 L420 220 L480 360"
        fill="none"
        stroke="url(#gold)"
        stroke-width="16"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- The Bocht -->
  <path d="M180 290
           C300 210, 400 210, 520 290"
        fill="none"
        stroke="currentColor"
        stroke-width="18"
        stroke-linecap="round"/>

  <!-- Main title (smaller & higher) -->
  <text x="350" y="460"
        text-anchor="middle"
        font-family="Montserrat, Arial, sans-serif"
        font-size="56"
        font-weight="900"
        letter-spacing="3"
        fill="currentColor">
    DEUR DEN BOCHT
  </text>

  <!-- Subtitle -->
  <text x="350" y="550"
        text-anchor="middle"
        font-family="Montserrat, Arial, sans-serif"
        font-size="22"
        letter-spacing="5"
        fill="currentColor">
    RALLY
  </text>
</svg>
