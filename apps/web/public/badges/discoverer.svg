<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Minimal flat round badge: translucent circle with accent icon -->
  <rect width="200" height="200" fill="none"/>
  <circle cx="100" cy="100" r="86" fill="rgba(255,255,255,0.12)"/>

  <!-- Compass needle (accent color) -->
  <g fill="#FFB77A" transform="translate(0,0)">
    <circle cx="100" cy="88" r="18" fill="#fff" />
    <polygon points="100,64 112,100 96,96" />
    <polygon points="100,112 88,76 104,80" opacity="0.95" />
  </g>
</svg>