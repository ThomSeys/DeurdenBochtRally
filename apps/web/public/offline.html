<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <title>Offline – Deur Den Bocht</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --brand: #f97316;
        --brand-dark: #c2410c;
        --gray-600: #4b5563;
        --gray-400: #9ca3af;
        --gray-100: #f3f4f6;
      }

      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #fff;
        color: #111;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        text-align: center;
      }

      .icon {
        width: 80px;
        height: 80px;
        background: var(--brand);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
      }

      .icon svg {
        width: 44px;
        height: 44px;
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        margin-bottom: 0.75rem;
      }

      p {
        color: var(--gray-600);
        font-size: 1rem;
        line-height: 1.625;
        max-width: 28rem;
        margin-bottom: 2rem;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--gray-100);
        color: var(--gray-600);
        font-size: 0.875rem;
        font-weight: 500;
        padding: 0.5rem 1rem;
        border-radius: 9999px;
        margin-bottom: 2rem;
      }

      .badge-dot {
        width: 8px;
        height: 8px;
        background: var(--gray-400);
        border-radius: 9999px;
      }

      button {
        background: var(--brand);
        color: #fff;
        border: none;
        border-radius: 0.5rem;
        font-size: 0.9375rem;
        font-weight: 600;
        padding: 0.75rem 1.75rem;
        cursor: pointer;
        transition: background 0.15s;
      }

      button:hover {
        background: var(--brand-dark);
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <!-- Wifi-off icon -->
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <circle cx="12" cy="20" r="1" fill="#fff" />
      </svg>
    </div>

    <h1>You're offline</h1>

    <div class="badge">
      <span class="badge-dot"></span>
      No internet connection
    </div>

    <p>
      Some pages may still be available from your cache. Try navigating to a
      page you've visited before, or reconnect and try again.
    </p>

    <button onclick="location.reload()">Try again</button>
  </body>
</html>
